name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (for example v0.4.0). Leave empty for the pushed tag."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      # Tokens without Actions write cannot dispatch this workflow from the CLI.
      # A temporary tag such as v0.4.0-backfill can rebuild and republish an
      # older tag; the suffix is stripped before checkout and publishing.
      - name: Resolve target tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "$tag" == *-backfill ]]; then
              tag="${tag%-backfill}"
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features gui

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/v-autoclicker.exe dist/
          Copy-Item README.md dist/
          Copy-Item assets/fonts/LICENSE.txt dist/FONT-LICENSE.txt
          Compress-Archive -Path dist/* -DestinationPath v-autoclicker-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-autoclicker-windows-x86_64
          path: v-autoclicker-windows-x86_64.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "$tag" == *-backfill ]]; then
              tag="${tag%-backfill}"
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features gui

      - name: Package
        run: |
          mkdir -p dist/v-autoclicker-linux-x86_64
          cp target/release/v-autoclicker dist/v-autoclicker-linux-x86_64/
          cp README.md dist/v-autoclicker-linux-x86_64/
          cp assets/fonts/LICENSE.txt dist/v-autoclicker-linux-x86_64/FONT-LICENSE.txt
          chmod +x dist/v-autoclicker-linux-x86_64/v-autoclicker
          tar -C dist -czf v-autoclicker-linux-x86_64.tar.gz v-autoclicker-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-autoclicker-linux-x86_64
          path: v-autoclicker-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, linux]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "$tag" == *-backfill ]]; then
              tag="${tag%-backfill}"
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      # The notes live on the default branch so an older tag can be backfilled
      # without moving that tag.
      - uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach archives to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: V-AutoClicker ${{ env.TAG }}
          body_path: .github/release-notes/${{ env.TAG }}.md
          files: dist/*
          fail_on_unmatched_files: true
