name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features gui

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/savv-autoclicker.exe dist/
          Copy-Item README.md dist/
          Copy-Item assets/fonts/LICENSE.txt dist/FONT-LICENSE.txt
          Compress-Archive -Path dist/* -DestinationPath savv-autoclicker-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: savv-autoclicker-windows-x86_64
          path: savv-autoclicker-windows-x86_64.zip
          if-no-files-found: error

      - name: Attach archive to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: savv-autoclicker-windows-x86_64.zip
          fail_on_unmatched_files: true
